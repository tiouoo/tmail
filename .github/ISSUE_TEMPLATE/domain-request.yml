name: 域名接入申请
description: 申请将你管理的域名加入 tmail.chilo.top
title: "[域名接入] "
body:
  - type: markdown
    attributes:
      value: |
        提交申请前，先写好投递 API 接入代码，将 `TMAIL_KEY` 留待审核后配置。提交 Issue 时附上代码截图或链接。管理员审核通过并登记域名后，会将密钥发到你填写的联系邮箱。收到密钥后再配置并试投。[投递 API 接入文档](https://github.com/tiouoo/tmail/blob/main/INBOUND.md#cloudflare-email-worker-示例)
  - type: input
    id: domain
    attributes:
      label: 接入域名
      description: 填写用于接收临时邮件的完整域名。
      placeholder: t.mymail.com
    validations:
      required: true
  - type: input
    id: contact-email
    attributes:
      label: 联系邮箱
      description: 请填写可正常收信且愿意在公开 Issue 中展示的邮箱。审核通过后，投递密钥将发送到这个邮箱。
      placeholder: contact@example.com
    validations:
      required: true
  - type: input
    id: receiver
    attributes:
      label: 邮件接收方式
      description: 填写用于接收和投递邮件的服务。
      placeholder: Cloudflare Email Routing + Worker
    validations:
      required: true
  - type: textarea
    id: integration-proof
    attributes:
      label: API 接入证明
      description: 上传接入代码截图或提供可公开查看的代码链接，展示收件域名的匹配条件以及发送投递 API 请求的代码。公开材料请遮盖私人信息。
    validations:
      required: true
  - type: textarea
    id: long-term-operation
    attributes:
      label: 长期使用证明与维护计划
      description: 说明预计维护多久以及续费安排，并附至少一项可核验材料，例如公开的域名到期记录链接或脱敏的续费凭证。
    validations:
      required: true
  - type: checkboxes
    id: commitments
    attributes:
      label: 确认事项
      options:
        - label: 我能管理该域名的 DNS，并可按管理员要求验证控制权。
          required: true
        - label: 我会长期维护该域名和收信服务，如需停用或转移会提前通知管理员。
          required: true
        - label: 我已写好投递 API 接入代码并附上代码截图或链接，会在审核通过并收到密钥后再配置和试投。
          required: true
